name: Combine Still Operational Heart audiobook

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/combine-still-operational-heart.yml"
      - "scripts/combine_still_operational_heart.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare FFmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Join Heart MP3 sections and verify timing
        run: python scripts/combine_still_operational_heart.py
      - name: Publish downloadable full audiobook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add still-operational/audio/chapter-1-heart.mp3 still-operational/audio/manifest.json
          if git diff --cached --quiet; then
            echo "Full audiobook is current"
          else
            git commit -m "Publish complete Kokoro Heart chapter audiobook MP3"
            git push origin HEAD:main
          fi
