name: Generate Still Operational Heart MP3s

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/still-operational-heart.yml"
      - "scripts/render_still_operational_heart.py"
      - "scripts/merge_still_operational_audio.py"
      - "still-operational/chapter-1.json"
      - "still-operational/draft-3/**"

permissions:
  contents: write

concurrency:
  group: still-operational-heart-render
  cancel-in-progress: false

jobs:
  render:
    name: "Narrate part ${{ matrix.part }}"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        part: ["01", "02", "03", "04a", "04b", "05", "06"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install voice tools
        run: |
          python -m pip install --disable-pip-version-check kokoro-onnx==0.6.1 numpy
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Download official Kokoro Heart model and voices
        run: |
          mkdir -p models
          curl -fSL --retry 3 --retry-delay 3 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx" -o models/kokoro-v1.0.int8.onnx
          curl -fSL --retry 3 --retry-delay 3 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin" -o models/voices-v1.0.bin
      - name: Render Heart audio
        run: python scripts/render_still_operational_heart.py --part ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        with:
          name: heart-part-${{ matrix.part }}
          path: |
            still-operational/audio/heart-${{ matrix.part }}.mp3
            still-operational/audio/heart-${{ matrix.part }}.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish MP3 files to book website
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: heart-part-*
          path: still-operational/audio
          merge-multiple: true
      - name: Verify and combine timing metadata
        run: python scripts/merge_still_operational_audio.py
      - name: Save narrated MP3s to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add still-operational/audio/
          if git diff --cached --quiet; then
            echo "No audio changes"
          else
            git commit -m "Publish pre-generated Kokoro Heart narration for Still Operational Chapter 1"
            git push origin HEAD:main
          fi
